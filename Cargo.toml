[workspace]
resolver = "3"
members = ["cpk", "cpktool", "gui", "fmath"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
lzokay = "2.0"
md-5 = "0.11"
encoding_rs = "0.8"
glob = "0.3"
clap = { version = "4.6", features = ["derive"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
