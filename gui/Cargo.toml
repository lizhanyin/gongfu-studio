[package]
name = "Gongfu-Studio"
version = "0.1.0"
description = "模型预览与编辑器"
edition = "2021"

[lib]
name = "gongfu_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"

