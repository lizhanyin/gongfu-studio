[package]
name = "Gongfu-Studio"
version = "0.1.0"
description = "模型预览与编辑器"
edition = "2021"

[lib]
name = "gongfu_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
cpk = { path = "../cpk" }
# 纹理路径为 GBK 编码（如 system\armonr\袖256.tga），需按 GBK 解码/写回
encoding_rs = "0.8"

# dev 模式开关：tauri 的 custom-protocol feature 决定 cfg(dev)。
# 默认（run.bat / 纯 cargo build）= 嵌入 ui/dist，无视 devUrl；
# `cargo build --no-default-features`（run-dev.bat / tauri dev）= dev 模式，
# 窗口加载 tauri.conf.json 的 devUrl（vite dev server，支持 HMR）。
[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]

